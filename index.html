<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Responsive</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rosarivo:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h6 class="rosarivo-regular title">Favourite</h6>
    <div class="product">
      <div class="img">
        <img src="/assets/cappuccino-dalgona.png" alt="Wireless Headphones" />
      </div>
      <div class="descr">
        <h3>Cappuccino</h3>
        <p>Dalgona Macha</p>
        <p class="price">₹299</p>
      </div>
      <img class="heart" src="assets/heart-red.png" />
    </div>
    <div class="product">
      <div class="img">
        <img src="/assets/cappuccino-bursting.png" alt="Wireless Headphones" />
      </div>
      <div class="descr">
        <h3>Cappuccino</h3>
        <p>Bursting Blueberry</p>
        <p class="price">₹299</p>
      </div>
      <img class="heart" src="assets/heart-red.png" />
    </div>
    <div class="product">
      <div class="img">
        <img src="/assets/cappuccino-cocoa.png" alt="Wireless Headphones" />
      </div>
      <div class="descr">
        <h3>Cappuccino</h3>
        <p>Cinnamon & Cocoa</p>
        <p class="price">₹299</p>
      </div>
      <img class="heart" src="assets/heart-red.png" />
    </div>
    <div class="navbar">
      <button class="nav-item" aria-label="Home">
        <img src="assets/home.png" />
      </button>

      <button class="nav-item" aria-label="Location">
        <img src="assets/location.png" />
      </button>

      <button class="nav-item active" aria-label="Favorites">
        <img src="assets/heart.png" />
      </button>
      <button class="nav-item" aria-label="Profile">
        <img src="assets/person.png" />
      </button>
    </div>
  </body>
</html>
